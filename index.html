<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#171923" />
<title>TrackO'clock</title>
<meta name="apple-mobile-web-app-title" content="TrackO'clock" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- SPLASH (shown briefly while Firebase checks for a persisted session) -->
<div id="splash-screen">
  <img src="icons/icon-192.png" alt="" class="splash-logo" />
  <div class="spinner"></div>
</div>

<!-- LOGIN -->
<div id="login-screen" hidden>
  <div class="card login-card" id="google-signin-card">
    <p class="card-title">Sign in</p>
    <button class="big-button" id="btn-google-signin" type="button">Sign in with Google</button>
    <p class="field-hint" id="login-error"></p>
  </div>

  <!-- Shown once, right after the very first Google sign-in for a brand new account -->
  <div class="card login-card" id="welcome-card" hidden>
    <p class="card-title">Welcome! A couple of one-time questions</p>
    <label class="field-label" for="welcome-employment-start-date">Employment start date</label>
    <input class="field-input" type="date" id="welcome-employment-start-date" />
    <label class="switch-row">
      <span>Eligible for צה"ל bonus?</span>
      <input type="checkbox" id="welcome-idf-eligible" />
    </label>
    <select class="field-input" id="welcome-idf-percent" hidden>
      <option value="2">2%</option>
      <option value="3">3%</option>
    </select>
    <label class="field-label" for="welcome-migrate-id">Migrating from an old Work ID? (optional)</label>
    <input class="field-input" type="text" id="welcome-migrate-id" placeholder="Old Work ID" autocomplete="off" />
    <input class="field-input" type="password" inputmode="numeric" id="welcome-migrate-pin" placeholder="Old PIN" autocomplete="off" />
    <p class="field-hint" id="welcome-error"></p>
    <button class="big-button" id="btn-welcome-continue" type="button">Continue</button>
  </div>
</div>

<div id="app-shell" hidden>

<header class="topbar">
  <h1 id="topbar-title">Home</h1>
</header>

<main id="app">

  <!-- HOME -->
  <section class="screen" id="screen-home" data-screen>
    <div class="card status-card">
      <p class="status-label" id="status-label">Not clocked in</p>
      <p class="status-sub" id="status-sub"></p>
      <button class="big-button" id="btn-clock" type="button">Clock In</button>
    </div>

    <div class="card">
      <p class="card-title">Luba points this month</p>
      <p class="points-balance" id="home-points-balance">0</p>
      <p class="points-sub" id="home-points-sub"></p>
    </div>
  </section>

  <!-- MONTHLY ATTENDANCE (formerly History) -->
  <section class="screen" id="screen-history" data-screen hidden>
    <div class="switch-row" id="history-month-nav">
      <button class="breakdown-link" id="history-prev-month" type="button">◀ Prev</button>
      <strong id="history-month-label">Month</strong>
      <button class="breakdown-link" id="history-next-month" type="button">Next ▶</button>
    </div>
    <button class="secondary-button" id="btn-open-more" type="button">More</button>
    <div class="table-scroll">
      <table class="log-table">
        <thead>
          <tr>
            <th>In</th>
            <th>Out</th>
            <th>Hours</th>
          </tr>
        </thead>
        <tbody id="history-table-body"></tbody>
      </table>
    </div>
  </section>

  <!-- CAFETERIA -->
  <section class="screen" id="screen-cafeteria" data-screen hidden>
    <div class="card">
      <p class="card-title">Balance this month</p>
      <p class="points-balance" id="cafeteria-balance">0</p>
      <p class="points-sub" id="cafeteria-balance-sub"></p>
    </div>
    <button class="secondary-button" id="btn-log-points" type="button">Log Luba points used</button>
    <ul class="list" id="cafeteria-list"></ul>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="screen-settings" data-screen hidden>
    <div class="card">
      <label class="field-label" for="settings-employment-start-date">Employment start date</label>
      <input class="field-input" type="date" id="settings-employment-start-date" />
      <p class="field-hint" id="settings-bonus-hint"></p>
      <label class="switch-row">
        <span>Eligible for צה"ל bonus?</span>
        <input type="checkbox" id="settings-idf-eligible" />
      </label>
      <select class="field-input" id="settings-idf-percent" hidden>
        <option value="2">2%</option>
        <option value="3">3%</option>
      </select>
    </div>
    <div class="card">
      <label class="switch-row">
        <span>Remind me to log Luba points on clock-out</span>
        <input type="checkbox" id="remind-points-toggle" />
      </label>
    </div>
    <div class="card">
      <label class="field-label" for="monthly-hours-goal">Monthly hours goal (optional)</label>
      <input class="field-input" type="number" min="0" id="monthly-hours-goal" placeholder="e.g. 186" />
    </div>
    <div class="card">
      <p class="card-title">Show in "More" screen</p>
      <label class="switch-row"><span>Work hours (week/month)</span><input type="checkbox" id="more-widget-hours" /></label>
      <label class="switch-row"><span>Shift count</span><input type="checkbox" id="more-widget-shifts" /></label>
      <label class="switch-row"><span>Total pay</span><input type="checkbox" id="more-widget-pay" /></label>
      <label class="switch-row"><span>Averages (per shift / per hour)</span><input type="checkbox" id="more-widget-averages" /></label>
      <label class="switch-row"><span>Luba points summary</span><input type="checkbox" id="more-widget-luba" /></label>
      <label class="switch-row"><span>Export buttons</span><input type="checkbox" id="more-widget-export" /></label>
    </div>
    <div class="card">
      <label class="field-label" for="theme-select">Dark Mode</label>
      <select class="field-input" id="theme-select">
        <option value="system">System Default</option>
        <option value="dark">On</option>
        <option value="light">Off</option>
      </select>
    </div>
    <div class="card">
      <p class="card-title">Account</p>
      <p class="field-hint" id="signed-in-as"></p>
      <button class="secondary-button" id="btn-logout" type="button">Switch user / Log out</button>
    </div>
  </section>

</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-nav="home" type="button">
    <span class="nav-icon">🏠</span><span>Home</span>
  </button>
  <button class="nav-btn" data-nav="history" type="button">
    <span class="nav-icon">📋</span><span>Attendance</span>
  </button>
  <button class="nav-btn" data-nav="cafeteria" type="button">
    <img class="nav-icon" src="icons/luba-icon.png" alt="" /><span>Luba</span>
  </button>
  <button class="nav-btn" data-nav="settings" type="button">
    <span class="nav-icon">⚙️</span><span>Settings</span>
  </button>
</nav>

</div>

<!-- Shift disambiguation / confirmation modal -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal">
    <h2 id="modal-title">Title</h2>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script type="module" src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
